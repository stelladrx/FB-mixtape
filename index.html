<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeTape // 80s Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&family=Outfit:wght@300;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f12;
            background-image: radial-gradient(circle at 50% 50%, #1e1e24 0%, #0f0f12 100%);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* The Biro Pen Script */
        .biro-script { 
            font-family: 'Reenie Beanie', cursive; 
            color: #2b4570; /* Classic blue pen ink */
            font-size: 1.75rem;
            line-height: 0.9;
            transform: rotate(-1deg);
        }

        /* 80s Photorealistic Transparent Cassette */
        .cassette-box {
            background: rgba(40, 40, 45, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            position: relative;
        }

        .tape-label {
            background: #e2e2e2;
            background-image: linear-gradient(to bottom, #d1d1d1 0%, #fff 20%, #fff 80%, #d1d1d1 100%);
            border-left: 15px solid #ff4d6d; /* Gen Z Pink */
            border-right: 15px solid #48cae4; /* 80s Teal */
        }

        .reel {
            width: 70px;
            height: 70px;
            background: #111;
            border: 6px solid #222;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .reel::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 2px;
            background: #444;
            transform: translate(-50%, -50%);
        }

        .spinning { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* J-Card / Tracklist */
        .j-card {
            background: #fdfdfd;
            border-radius: 2px;
            box-shadow: 10px 10px 0px #ff4d6d;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        .input-glow:focus {
            box-shadow: 0 0 20px rgba(72, 202, 228, 0.4);
        }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0.05; z-index: 9999;
            background-image: url('https://media.giphy.com/media/oEI9uWU0WMrQmOsh6h/giphy.gif');
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-8">
    <div class="noise"></div>

    <div class="w-full max-w-lg z-10">
        <div class="text-center mb-12">
            <span class="text-xs tracking-[0.4em] text-cyan-400 uppercase font-bold">Retro-Synth Generator</span>
            <h1 class="text-6xl font-black italic tracking-tighter mt-2 bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">VIBE-TAPE</h1>
        </div>

        <div class="relative group mb-16">
            <input id="vibeInput" type="text" placeholder="DROP A MOOD..." 
                class="w-full bg-transparent border-b-2 border-white/20 p-4 text-2xl outline-none text-center transition-all input-glow uppercase tracking-widest font-bold focus:border-cyan-400">
            <button onclick="mixTape()" class="mt-6 w-full py-4 bg-white text-black font-black hover:bg-cyan-400 transition-colors tracking-widest text-sm">GENERATE MIXTAPE</button>
        </div>

        <div id="tapeUI" class="hidden opacity-0 transition-opacity duration-1000">
            <div class="cassette-box p-6 mb-12">
                <div class="tape-label h-32 rounded flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="displayTitle" class="biro-script text-4xl z-10"></div>
                </div>
                
                <div class="flex justify-center gap-16 mt-6 relative h-24 items-center">
                    <div id="reelL" class="reel"></div>
                    <div class="w-24 h-12 bg-black/40 rounded-sm border border-white/10 flex items-center justify-center">
                        <span class="text-[8px] text-white/20 font-mono">TAPE FLOWING</span>
                    </div>
                    <div id="reelR" class="reel"></div>
                </div>
            </div>

            <div class="j-card p-8 rotate-1">
                <div class="flex justify-between items-start border-b border-black/10 pb-2 mb-4">
                    <span class="text-black font-black text-xs italic">A-SIDE // 10 TRACKS</span>
                    <span id="dateStamp" class="text-black/40 text-[10px] font-mono"></span>
                </div>
                <ul id="trackList" class="biro-script list-decimal pl-6">
                    </ul>
                <div class="mt-8 flex justify-center">
                    <a id="spotLink" target="_blank" class="px-8 py-3 bg-[#1DB954] text-white rounded-full font-bold text-xs hover:scale-105 transition-transform">OPEN ON SPOTIFY</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const retroSongs = [
            { t: "Dreams", a: "Fleetwood Mac" }, { t: "Everybody Wants to Rule the World", a: "Tears for Fears" },
            { t: "Self Control", a: "Laura Branigan" }, { t: "Blue Monday", a: "New Order" },
            { t: "Nightcall", a: "Kavinsky" }, { t: "Out of Touch", a: "Hall & Oates" },
            { t: "The Less I Know The Better", a: "Tame Impala" }, { t: "Smalltown Boy", a: "Bronski Beat" },
            { t: "West End Girls", a: "Pet Shop Boys" }, { t: "Borderline", a: "Madonna" },
            { t: "Enjoy the Silence", a: "Depeche Mode" }, { t: "Electric Feel", a: "MGMT" },
            { t: "Careless Whisper", a: "George Michael" }, { t: "Blinding Lights", a: "The Weeknd" }
        ];

        function mixTape() {
            const vibe = document.getElementById('vibeInput').value;
            if(!vibe) return;

            // Trigger Reels
            document.getElementById('reelL').classList.add('spinning');
            document.getElementById('reelR').classList.add('spinning');

            setTimeout(() => {
                const ui = document.getElementById('tapeUI');
                ui.classList.remove('hidden');
                setTimeout(() => ui.classList.add('opacity-100'), 10);

                document.getElementById('displayTitle').innerText = vibe;
                document.getElementById('dateStamp').innerText = new Date().toLocaleDateString();

                const list = document.getElementById('trackList');
                list.innerHTML = "";
                const picks = [...retroSongs].sort(() => 0.5 - Math.random()).slice(0, 10);
                
                picks.forEach(song => {
                    const li = document.createElement('li');
                    li.className = "mb-1";
                    li.innerText = `${song.t} — ${song.a}`;
                    list.appendChild(li);
                });

                const query = encodeURIComponent(vibe + " 80s retro vibe");
                document.getElementById('spotLink').href = `https://open.spotify.com/search/${query}`;
                
                document.getElementById('reelL').classList.remove('spinning');
                document.getElementById('reelR').classList.remove('spinning');
            }, 1200);
        }
    </script>
</body>
</html>

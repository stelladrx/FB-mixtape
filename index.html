<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biro & Tape | Custom Mixtape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root {
            --plastic-shine: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
        }
        body { background: #e5e5e1; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; }
        .biro-script { font-family: 'Caveat', cursive; color: #1a2a6c; line-height: 1.1; }
        
        /* Photorealistic Cassette */
        .cassette-case {
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5), inset 0 0 10px #000;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
        }
        .cassette-label {
            background: #fdfdfd;
            background-image: repeating-linear-gradient(#f0f0f0 0px, #f0f0f0 1px, transparent 1px, transparent 15px);
            border-bottom: 12px solid #c0392b;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .tape-window-realistic {
            background: #0a0a0a;
            box-shadow: inset 0 0 15px #000;
            border: 3px solid #222;
            position: relative;
        }
        .gear {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ddd 20%, #333 21%, #333 100%);
            border: 4px dashed #111;
            border-radius: 50%;
        }
        .spinning { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* J-Card Paper Texture */
        .j-card {
            background: #fff;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.1);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold tracking-widest uppercase text-gray-800" style="font-family: 'Courier Prime';">Mixtape Lab v1.0</h1>
            <div class="mt-4 flex gap-2">
                <input id="vibeInput" type="text" placeholder="e.g. 80s Sunset, Midnight Drive..." class="w-full p-3 border-b-2 border-black bg-transparent outline-none italic">
                <button onclick="generateMixtape()" class="bg-black text-white px-6 py-2 hover:bg-gray-800 transition">GENERATE</button>
            </div>
        </header>

        <div id="output" class="hidden space-y-12">
            <div class="cassette-case w-full aspect-[1.6/1] p-4 flex flex-col justify-between">
                <div class="cassette-label w-full h-3/5 rounded-sm p-4 flex flex-col items-center">
                    <div id="tapeTitle" class="biro-script text-4xl mt-2 text-blue-900"></div>
                </div>
                
                <div class="flex justify-center gap-12 -mt-10">
                    <div class="tape-window-realistic w-48 h-16 rounded-full flex justify-around items-center">
                        <div id="gearLeft" class="gear"></div>
                        <div id="gearRight" class="gear"></div>
                    </div>
                </div>

                <div class="flex justify-between text-[10px] text-gray-500 font-mono px-4 pb-2">
                    <span>NR [ON]</span>
                    <span>TYPE II - CHROME</span>
                    <span>90 MIN</span>
                </div>
            </div>

            <div class="j-card p-10 relative border-l-8 border-red-600">
                <div class="absolute top-4 right-4 text-xs text-gray-400 font-mono uppercase">Side A</div>
                <h2 class="biro-script text-3xl mb-6 underline decoration-pink-300">Tracklist</h2>
                <ol id="trackList" class="biro-script text-2xl space-y-1 ml-4"></ol>
                
                <div class="mt-10 flex justify-between items-end">
                    <div class="text-[10px] font-mono text-gray-400 uppercase tracking-widest">Recorded on 07/02/2026</div>
                    <a id="spotifyBtn" href="#" target="_blank" class="bg-green-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg hover:scale-105 transition-transform">LISTEN ON SPOTIFY</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const library = [
            { t: "Never Gonna Give You Up", a: "Rick Astley" },
            { t: "Take on Me", a: "A-ha" },
            { t: "Careless Whisper", a: "George Michael" },
            { t: "Billie Jean", a: "Michael Jackson" },
            { t: "Africa", a: "Toto" },
            { t: "Smalltown Boy", a: "Bronski Beat" },
            { t: "Sweet Dreams", a: "Eurythmics" },
            { t: "Bette Davis Eyes", a: "Kim Carnes" },
            { t: "Time After Time", a: "Cyndi Lauper" },
            { t: "The Winner Takes It All", a: "ABBA" },
            { t: "Self Control", a: "Laura Branigan" },
            { t: "Drive", a: "The Cars" },
            { t: "Don't You Want Me", a: "The Human League" },
            { t: "West End Girls", a: "Pet Shop Boys" },
            { t: "True", a: "Spandau Ballet" }
        ];

        function generateMixtape() {
            const vibe = document.getElementById('vibeInput').value;
            if (!vibe) return;

            // Start animation
            document.getElementById('gearLeft').classList.add('spinning');
            document.getElementById('gearRight').classList.add('spinning');
            
            // Randomize 10 songs
            const shuffled = [...library].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            setTimeout(() => {
                document.getElementById('output').classList.remove('hidden');
                document.getElementById('tapeTitle').innerText = vibe;
                
                const list = document.getElementById('trackList');
                list.innerHTML = "";
                shuffled.forEach((s, i) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="opacity-50 text-sm mr-2">${i+1}</span> ${s.t} - ${s.a}`;
                    list.appendChild(li);
                });

                const query = encodeURIComponent(vibe + " mix");
                document.getElementById('spotifyBtn').href = `https://open.spotify.com/search/${query}`;
                
                document.getElementById('gearLeft').classList.remove('spinning');
                document.getElementById('gearRight').classList.remove('spinning');
                
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 1000);
        }
    </script>
</body>
</html>
